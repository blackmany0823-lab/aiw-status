<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>狀態（唯讀）</title>
<style>body{margin:0;background:#f5f7fa;color:#16202a;font:18px/1.55 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:1rem}.card{background:#fff;border-radius:.75rem;margin:.75rem 0;padding:1rem;box-shadow:0 1px 3px #0002}h1{font-size:1.5rem;margin:.25rem 0}h2{font-size:1.1rem;margin:0 0 .5rem}dl{margin:0}dt{color:#536171;font-size:.85rem}dd{margin:0 0 .7rem;font-weight:600;overflow-wrap:anywhere}.warning{background:#fff3cd;color:#5c4300;border:2px solid #d59d00;font-weight:700}.unknown{color:#8a2800}.small{font-size:.85rem;color:#536171}.usage-row{margin:.6rem 0}.usage-label{display:flex;justify-content:space-between;font-size:.9rem}.bar{height:.7rem;background:#e7ebf0;border-radius:1rem;overflow:hidden}.bar i{display:block;height:100%;background:#3275c8}.project{margin:.85rem 0}.project-name{font-weight:700}.positions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}.position{min-width:0;border:1px solid #dce2e9;border-radius:.5rem;padding:.4rem;font-size:.8rem}.tiles{display:flex;gap:2px;flex-wrap:wrap;margin-top:.25rem}.tile{width:.55rem;height:.55rem;border-radius:2px;background:#64748b}.color-blue{color:#2563eb}.color-green{color:#15803d}.color-orange{color:#c2410c}.color-purple{color:#7e22ce}.color-teal{color:#0f766e}.color-red{color:#b91c1c}.color-gray{color:#64748b}.project{border-left:.45rem solid #64748b;padding-left:.5rem}.category-blue{border-color:#2563eb}.category-green{border-color:#15803d}.category-orange{border-color:#c2410c}.category-gray{border-color:#64748b}.shade-light{opacity:.55}.shade-medium{opacity:.78}.shade-dark{opacity:1}@media(max-width:360px){main{padding:.5rem}.positions{grid-template-columns:1fr}}</style>
</head><body><main><h1>狀態（唯讀）</h1><p class="small">僅供查看，沒有控制功能。</p><section class="card"><h2>白話現況</h2><p id="plain">載入資料中…</p></section><p id="freshness" class="card">載入資料中…</p><section class="card"><h2>目前狀態</h2><dl id="state"></dl></section><section class="card"><h2>額度</h2><div id="usage">尚無資料</div></section><section class="card"><h2>專案工單分布</h2><div id="projects">尚無資料</div></section><section class="card"><h2>最近工單狀態計數</h2><dl id="orders"></dl></section><section class="card small"><dl id="meta"></dl></section></main>
<script>
const labels={programState:'程式',autonomousHandoff:'自主接棒',postman:'郵差',humanGatesPending:'Human Gate 待處理',githubSync:'GitHub 同步',lastSuccessfulSync:'最後成功時間',generatedUtc:'資料產生時間',sourceSha256:'來源 SHA',parseStatus:'解析狀態'};
const show=(target,pairs)=>document.querySelector(target).innerHTML=pairs.map(([k,v])=>`<dt>${labels[k]||k}</dt><dd class="${v==='UNKNOWN'?'unknown':''}">${v}</dd>`).join('');
const usage=(data)=>{const host=document.querySelector('#usage'),rows=[];for(const [service,name] of [['openai','OpenAI'],['claude','Claude']])for(const [key,title] of [['fiveHourRemainingPercent','5H 剩餘'],['weeklyRemainingPercent','每週剩餘']]){const value=data?.[service]?.[key],valid=Number.isInteger(value)&&value>=0&&value<=100;rows.push(`<div class="usage-row"><div class="usage-label"><span>${name} ${title}</span><b>${valid?value+'%':'尚無資料'}</b></div><div class="bar">${valid?`<i style="width:${value}%"></i>`:''}</div></div>`)}host.innerHTML=rows.join('')};
const projects=(items)=>{const host=document.querySelector('#projects'),positions={queued:'排隊',working:'施工中',waitingReview:'待審查',reviewing:'審查中',waitingOwner:'等 Owner'},categories={'專案':'green','維護':'blue','Owner要求':'orange','未分類':'gray'},shades=['light','medium','dark'];host.innerHTML=Array.isArray(items)&&items.length?items.map(p=>{const color=categories[p.category]||'gray',shade=shades.includes(p.shade)?p.shade:'medium';return `<div class="project category-${color} shade-${shade}"><div class="positions">${Object.entries(positions).map(([k,n])=>`<div class="position">${n}：${p.counts?.[k]??0}</div>`).join('')}</div></div>`}).join(''):'尚無資料'};
fetch('status.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{const age=Date.now()-Date.parse(s.generatedUtc),stale=!Number.isFinite(age)||age>s.staleAfterMinutes*60000,f=document.querySelector('#freshness'),plain=Array.isArray(s.plainLines)&&s.plainLines.length===3?s.plainLines:['現在：資料不明','卡住：資料不明','要你做的事：資料不明'];document.querySelector('#plain').textContent=plain.join('\n');document.querySelector('#plain').style.whiteSpace='pre-line';f.textContent=stale?'已過期，不可視為現況':'資料在 30 分鐘內產生';f.className=stale?'card warning':'card';show('#state',['programState','autonomousHandoff','postman','humanGatesPending','githubSync','lastSuccessfulSync'].map(k=>[k,s[k]??'UNKNOWN']));usage(s.usage);projects(s.projects);show('#orders',Object.entries(s.recentOrderStatusCounts||{UNKNOWN:'UNKNOWN'}));show('#meta',['generatedUtc','sourceSha256','parseStatus'].map(k=>[k,s[k]??'UNKNOWN']));}).catch(()=>{const f=document.querySelector('#freshness');f.textContent='已過期，不可視為現況';f.className='card warning';show('#state',[['parseStatus','UNKNOWN']]);});
</script></body></html>
