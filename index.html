<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>狀態（唯讀）</title>
<style>body{margin:0;background:#f5f7fa;color:#16202a;font:18px/1.55 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:1rem}.card{background:#fff;border-radius:.75rem;margin:.75rem 0;padding:1rem;box-shadow:0 1px 3px #0002}h1{font-size:1.5rem;margin:.25rem 0}h2{font-size:1.1rem;margin:0 0 .5rem}dl{margin:0}dt{color:#536171;font-size:.85rem}dd{margin:0 0 .7rem;font-weight:600;overflow-wrap:anywhere}.warning{background:#fff3cd;color:#5c4300;border:2px solid #d59d00;font-weight:700}.unknown{color:#8a2800}.small{font-size:.85rem;color:#536171}</style>
</head><body><main><h1>狀態（唯讀）</h1><p class="small">僅供查看，沒有控制功能。</p><section class="card"><h2>白話現況</h2><p id="plain">載入資料中…</p></section><p id="freshness" class="card">載入資料中…</p><section class="card"><h2>目前狀態</h2><dl id="state"></dl></section><section class="card"><h2>最近工單狀態計數</h2><dl id="orders"></dl></section><section class="card small"><dl id="meta"></dl></section></main>
<script>
const labels={programState:'程式',autonomousHandoff:'自主接棒',postman:'郵差',humanGatesPending:'Human Gate 待處理',githubSync:'GitHub 同步',lastSuccessfulSync:'最後成功時間',generatedUtc:'資料產生時間',sourceSha256:'來源 SHA',parseStatus:'解析狀態'};
const show=(target,pairs)=>document.querySelector(target).innerHTML=pairs.map(([k,v])=>`<dt>${labels[k]||k}</dt><dd class="${v==='UNKNOWN'?'unknown':''}">${v}</dd>`).join('');
fetch('status.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{const age=Date.now()-Date.parse(s.generatedUtc),stale=!Number.isFinite(age)||age>s.staleAfterMinutes*60000,f=document.querySelector('#freshness'),plain=Array.isArray(s.plainLines)&&s.plainLines.length===3?s.plainLines:['現在：資料不明','卡住：資料不明','要你做的事：資料不明'];document.querySelector('#plain').textContent=plain.join('\n');document.querySelector('#plain').style.whiteSpace='pre-line';f.textContent=stale?'已過期，不可視為現況':'資料在 30 分鐘內產生';f.className=stale?'card warning':'card';show('#state',['programState','autonomousHandoff','postman','humanGatesPending','githubSync','lastSuccessfulSync'].map(k=>[k,s[k]??'UNKNOWN']));show('#orders',Object.entries(s.recentOrderStatusCounts||{UNKNOWN:'UNKNOWN'}));show('#meta',['generatedUtc','sourceSha256','parseStatus'].map(k=>[k,s[k]??'UNKNOWN']));}).catch(()=>{const f=document.querySelector('#freshness');f.textContent='已過期，不可視為現況';f.className='card warning';show('#state',[['parseStatus','UNKNOWN']]);});
</script></body></html>
